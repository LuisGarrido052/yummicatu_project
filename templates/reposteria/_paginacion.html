{% if is_paginated %}
  <nav class="yc-paginacion" aria-label="Paginación">
    {% if page_obj.has_previous %}
      <a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}" class="yc-link">← Anterior</a>
    {% endif %}
    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}" class="yc-link">Siguiente →</a>
    {% endif %}
  </nav>
{% endif %}
