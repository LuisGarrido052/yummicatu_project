<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#C1121F" />
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FCEADE" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1C0E" />
      <stop offset="100%" stop-color="#7B3F1D" />
    </linearGradient>
  </defs>

  <!-- Strawberry Icon -->
  <g transform="translate(10, 8)">
    <!-- Strawberry body -->
    <path d="M 22 10 C 14 10, 6 18, 6 28 C 6 38, 18 46, 22 49 C 26 46, 38 38, 38 28 C 38 18, 30 10, 22 10 Z" fill="url(#berryGrad)" />
    <!-- Seeds -->
    <ellipse cx="16" cy="22" rx="1.2" ry="2" fill="#FFE5EC" opacity="0.8" />
    <ellipse cx="28" cy="22" rx="1.2" ry="2" fill="#FFE5EC" opacity="0.8" />
    <ellipse cx="22" cy="30" rx="1.2" ry="2" fill="#FFE5EC" opacity="0.8" />
    <ellipse cx="17" cy="38" rx="1" ry="1.8" fill="#FFE5EC" opacity="0.8" />
    <ellipse cx="27" cy="38" rx="1" ry="1.8" fill="#FFE5EC" opacity="0.8" />
    
    <!-- Cream Swirl Top with cute cat ears hint -->
    <path d="M 12 14 C 14 6, 20 2, 22 2 C 24 2, 30 6, 32 14 C 28 11, 24 10, 22 11 C 20 10, 16 11, 12 14 Z" fill="#2D6A4F" />
    <!-- Whipped Cream Swirl on top -->
    <path d="M 14 10 C 18 6, 22 8, 25 5 C 27 10, 31 11, 28 13 C 24 14, 18 13, 14 10 Z" fill="url(#creamGrad)" opacity="0.9" />
  </g>

  <!-- Brand Typography -->
  <text x="60" y="32" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">Yummi</text>
  <text x="142" y="32" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="800" fill="#E63946" letter-spacing="-0.5">Catu</text>
  <text x="62" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#8C5329" letter-spacing="2">FRUTILLAS &amp; REPOSTERÍA</text>
</svg>
